CFLAGS="-O2 -pipe -march=skylake \
-fcf-protection=none -fomit-frame-pointer \
-fdata-sections -ffunction-sections \
-fno-sanitize=all -fno-stack-protector -fno-semantic-interposition \
-fno-plt -fno-common"

CPPFLAGS="${CFLAGS} -DNDEBUG \
-U_FORTIFY_SOURCE \
-U_GLIBCXX_ASSERTIONS \
-U_LIBCPP_ENABLE_HARDENED_MODE \
-U_LIBCPP_ENABLE_ASSERTIONS"

CXXFLAGS="${CFLAGS} -fvisibility-inlines-hidden"

LD="ld.bfd"
LDFLAGS="-fuse-ld=bfd \
-Wl,-O2 \
-Wl,-z,pack-relative-relocs \
-Wl,-z,norelro \
-Wl,-z,lazy \
-Wl,--sort-common \
-Wl,--as-needed \
-Wl,--gc-sections \
-Wl,--relax \
-Wl,--strip-debug \
-Wl,--strip-all \
-Wl,--defsym=__gentoo_check_ldflags__=0"

RUSTFLAGS="-C target-cpu=skylake \
-C opt-level=3 \
-C codegen-units=1 \
-C strip=symbols \
-C overflow-checks=off \
-C panic=abort"

RUSTFLAGS="${RUSTFLAGS} -C link-arg=-fuse-ld=bfd \
-C link-arg=-Wl,-O2 \
-C link-arg=-Wl,-z,pack-relative-relocs \
-C link-arg=-Wl,-z,norelro \
-C link-arg=-Wl,-z,lazy \
-C link-arg=-Wl,--sort-common \
-C link-arg=-Wl,--as-needed \
-C link-arg=-Wl,--gc-sections \
-C link-arg=-Wl,--relax \
-C link-arg=-Wl,--strip-debug \
-C link-arg=-Wl,--strip-all \
-C link-arg=-Wl,--defsym=__gentoo_check_ldflags__=0"

FCFLAGS="${CFLAGS}"
FFLAGS="${CFLAGS}"
F77FLAGS="${CFLAGS}"
