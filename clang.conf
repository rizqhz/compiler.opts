CFLAGS="-O2 -pipe -march=skylake -falign-functions=64 -fcf-protection=none -fomit-frame-pointer \
-fno-sanitize=all -fno-stack-protector -fno-semantic-interposition -fno-plt -fno-common \
-fno-lto -Wno-error=odr -Wno-error=strict-aliasing \
-fno-math-errno -fno-signed-zeros -fno-rounding-math -fno-trapping-math \
-fassociative-math -freciprocal-math -ffinite-math-only -fcx-limited-range -ffp-contract=fast -fexcess-precision=fast \
-fdata-sections -ffunction-sections \
-fvectorize -ftree-vectorize -floop-interchange \
-mllvm -polly -mllvm -polly-parallel -mllvm -polly-num-threads=8 -mllvm -polly-vectorizer=stripmine \
-mllvm -polly-scheduling=dynamic -mllvm -polly-omp-backend=LLVM \
-fdirect-access-external-data"

CPPFLAGS="${CFLAGS} -DNDEBUG \
-U__PIE__ -U__SSP__ -U__SSP_STRONG__ -U__SSP_ALL__ \
-U_FORTIFY_SOURCE \
-U_GLIBCXX_ASSERTIONS \
-U_LIBCPP_ENABLE_HARDENED_MODE \
-U_LIBCPP_ENABLE_ASSERTIONS"

CXXFLAGS="${CFLAGS} -fno-force-emit-vtables \
-fstrict-vtable-pointers \
-fvisibility-inlines-hidden"

LD="ld.lld"
LDFLAGS="-fuse-ld=lld -rtlib=compiler-rt \
-Wl,--threads=8 \
-Wl,-O3 \
-Wl,-z,pack-relative-relocs \
-Wl,-z,norelro \
-Wl,-z,lazy \
-Wl,--sort-common \
-Wl,--as-needed \
-Wl,--gc-sections \
-Wl,--relax \
-Wl,--strip-debug \
-Wl,--strip-all \
-Wl,--icf=all \
-Wl,--defsym=__gentoo_check_ldflags__=0"

RUSTFLAGS="-C target-cpu=skylake \
-C opt-level=3 \
-C codegen-units=1 \
-C strip=symbols \
-C overflow-checks=off \
-C panic=abort"

RUSTFLAGS="${RUSTFLAGS} -C linker=clang -C link-arg=-fuse-ld=lld \
-C link-arg=-Wl,--threads=8 \
-C link-arg=-Wl,-O3 \
-C link-arg=-Wl,-z,pack-relative-relocs \
-C link-arg=-Wl,-z,norelro \
-C link-arg=-Wl,-z,lazy \
-C link-arg=-Wl,--sort-common \
-C link-arg=-Wl,--as-needed \
-C link-arg=-Wl,--gc-sections \
-C link-arg=-Wl,--relax \
-C link-arg=-Wl,--strip-debug \
-C link-arg=-Wl,--strip-all \
-C link-arg=-Wl,--icf=all \
-C link-arg=-Wl,--defsym=__gentoo_check_ldflags__=0"

FCFLAGS="${CFLAGS}"
FFLAGS="${CFLAGS}"
F77FLAGS="${CFLAGS}"

CC="clang"
CPP="clang-cpp"
CXX="clang++"
FC="flang"
F77="flang"
AR="llvm-ar"
AS="llvm-as"
NM="llvm-nm"
RANLIB="llvm-ranlib"
ADDR2LINE="llvm-addr2line"
CXXFILT="llvm-cxxfilt"
GCOV="llvm-cov"
OBJCOPY="llvm-objcopy"
OBJDUMP="llvm-objdump"
READELF="llvm-readelf"
SIZE="llvm-size"
STRINGS="llvm-strings"
STRIP="llvm-strip"
