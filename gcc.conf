CFLAGS="-O2 -pipe -march=skylake -falign-functions=64:8:16:4 -fcf-protection=none -fomit-frame-pointer \
-fno-sanitize=all -fno-stack-protector -fno-semantic-interposition -fno-plt -fno-common \
-fno-lto -Wno-error=odr -Wno-error=strict-aliasing -Wno-error=lto-type-mismatch \
-fno-math-errno -fno-signed-zeros -fno-rounding-math -fno-trapping-math -fno-signaling-nans \
-fassociative-math -freciprocal-math -ffinite-math-only -fcx-limited-range -ffp-contract=fast -fexcess-precision=fast \
-fdata-sections -ffunction-sections \
-fgraphite -fgraphite-identity -ftree-vectorize -fvect-cost-model=very-cheap \
-ftree-loop-optimize -ftree-loop-vectorize -floop-interchange -floop-nest-optimize \
-floop-parallelize-all -floop-unroll-and-jam \
-fexpensive-optimizations -fipa-pta -fdevirtualize-at-ltrans"

CPPFLAGS="${CFLAGS} -DNDEBUG \
-U__PIE__ -U__SSP__ -U__SSP_STRONG__ -U__SSP_ALL__ \
-U_FORTIFY_SOURCE \
-U_GLIBCXX_ASSERTIONS \
-U_LIBCPP_ENABLE_HARDENED_MODE \
-U_LIBCPP_ENABLE_ASSERTIONS"

CXXFLAGS="${CFLAGS} -fvisibility-inlines-hidden"

LD="ld.bfd"
LDFLAGS="-fuse-ld=bfd \
-Wl,-O2 \
-Wl,-z,pack-relative-relocs \
-Wl,-z,norelro \
-Wl,-z,lazy \
-Wl,--sort-common \
-Wl,--as-needed \
-Wl,--gc-sections \
-Wl,--relax \
-Wl,--strip-debug \
-Wl,--strip-all \
-Wl,--defsym=__gentoo_check_ldflags__=0"

RUSTFLAGS="-C target-cpu=skylake \
-C opt-level=3 \
-C codegen-units=1 \
-C strip=symbols \
-C overflow-checks=off \
-C panic=abort"

RUSTFLAGS="${RUSTFLAGS} -C link-arg=-fuse-ld=bfd \
-C link-arg=-Wl,-O2 \
-C link-arg=-Wl,-z,pack-relative-relocs \
-C link-arg=-Wl,-z,norelro \
-C link-arg=-Wl,-z,lazy \
-C link-arg=-Wl,--sort-common \
-C link-arg=-Wl,--as-needed \
-C link-arg=-Wl,--gc-sections \
-C link-arg=-Wl,--relax \
-C link-arg=-Wl,--strip-debug \
-C link-arg=-Wl,--strip-all \
-C link-arg=-Wl,--defsym=__gentoo_check_ldflags__=0"

FCFLAGS="${CFLAGS}"
FFLAGS="${CFLAGS}"
F77FLAGS="${CFLAGS}"

CC="gcc"
CPP="cpp"
CXX="g++"
FC="gfortran"
F77="gfortran"
AR="ar"
AS="as"
NM="nm"
RANLIB="ranlib"
ADDR2LINE="addr2line"
CXXFILT="c++filt"
GCOV="gcov"
OBJCOPY="objcopy"
OBJDUMP="objdump"
READELF="readelf"
SIZE="size"
STRINGS="strings"
STRIP="strip"
GPROF="gprof"
ELFEDIT="elfedit"
LEX="flex"
YACC="yacc"
